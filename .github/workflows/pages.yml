name: Deploy web app to GitHub Pages

# Builds web/ and publishes it to the gh-pages branch, which GitHub Pages serves
# at https://moslemjaw.github.io/Nafas/. Each deploy replaces the branch with a
# single commit, so gh-pages never grows with old builds.

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Publish dist/ to gh-pages
        working-directory: web/dist
        run: |
          touch .nojekyll
          # Vercel (Root Directory "web") also sees this branch: give it a web/ folder
          # whose vercel.json says not to deploy, so gh-pages pushes are skipped there
          mkdir -p web
          echo '{ "git": { "deploymentEnabled": false } }' > web/vercel.json
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy web app build from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
